services:
  postgres:
    image: postgres:17-alpine
    container_name: cistem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cistem
      POSTGRES_PASSWORD: cistem
      POSTGRES_DB: cistem
    ports:
      - "5432:5432"
    volumes:
      - cistem-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cistem -d cistem"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cistem-postgres-data:
